[theme]
base = "dark"

# Palette: blue-tinted near-blacks under the logo cyan. web/static/styles/style.css mirrors these as
# --tt-* variables for hand-written HTML; change both together.
primaryColor = "#52b9e4"
backgroundColor = "#0b1016"
secondaryBackgroundColor = "#18212d"
textColor = "#e6edf3"
borderColor = "#3a4860"
linkColor = "#52b9e4"
linkUnderline = false
showWidgetBorder = true
codeBackgroundColor = "#121923"
dataframeBorderColor = "#2e3b4f"
dataframeHeaderBackgroundColor = "#121923"

# Type: Barlow's DIN-style shapes echo the logo lettering; IBM Plex Sans stays readable in dense tables.
# Self-hosted from web/static/fonts (Fontsource 5.3.0, SIL OFL; licences alongside); faces listed at the end of [theme].
font = "IBM Plex Sans, sans-serif"
headingFont = "Barlow Semi Condensed, IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"

# Charts (Plotly, Altair, Vega-Lite): cyan first, then hues that stay apart on the dark background
chartCategoricalColors = ["#52b9e4", "#f2a541", "#7bd389", "#e5707e", "#b39ddb", "#f7d06b", "#4fd1c5", "#ff8fb1", "#a3d977", "#9aa7b8"]
chartSequentialColors = ["#10283a", "#13354d", "#174462", "#1b5478", "#20658f", "#2a78a7", "#3a8fc0", "#52b9e4", "#8ad0ee", "#c4e8f7"]
chartDivergingColors = ["#c2410c", "#e0662a", "#f0955a", "#f6c49b", "#e9e4de", "#d5e8f2", "#9fd3ec", "#6bbde4", "#3a9fd0", "#1f78a8"]

# One face per weight/style and subset (latin, latin-ext); browsers fetch only the files a page uses
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

